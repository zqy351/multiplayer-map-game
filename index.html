<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>大地图探险 · 多人联机小游戏</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316352a'/%3E%3Cpath d='M16 4l3.5 7.5L27 15l-7.5 3.5L16 26l-3.5-7.5L5 15l7.5-3.5z' fill='%23f0b93a'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%23fff3c4'/%3E%3C/svg%3E" />
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{
  --bg:#0b1220;
  --panel:rgba(13,25,40,.94);
  --line:rgba(255,255,255,.12);
  --text:#e7edf4;
  --muted:#93a4b8;
  --gold:#f0b93a;
}
*{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text);
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
  -webkit-user-select:none; user-select:none; }
button{ font-family:inherit; }
#game{ position:fixed; inset:0; display:block; width:100vw; height:100vh; background:#16291c; touch-action:none; }

/* ===== 主菜单 ===== */
#menu{ position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center; padding:20px;
  background:radial-gradient(120% 90% at 50% 0%,#17344c 0%,#0b1220 55%,#0d1c2b 100%); }
#menu .panel{ width:min(430px,100%); background:var(--panel); border:1px solid var(--line); border-radius:20px;
  padding:34px 28px 26px; box-shadow:0 26px 80px rgba(0,0,0,.5); }
#menu .mark{ width:58px; height:58px; margin:0 auto 14px; display:block;
  filter:drop-shadow(0 6px 14px rgba(240,185,58,.25)); }
#menu h1{ font-size:27px; letter-spacing:4px; text-align:center; color:#fff; font-weight:800; }
#menu .sub{ margin:10px 0 22px; color:var(--muted); font-size:14px; text-align:center; line-height:1.9; }
#menu .sub b{ color:var(--gold); font-weight:600; }
input{ width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:rgba(255,255,255,.06);
  color:var(--text); font-size:15px; outline:none; }
input:focus{ border-color:var(--gold); box-shadow:0 0 0 3px rgba(240,185,58,.15); }
input::placeholder{ color:#5d6f84; }
#nick{ margin-bottom:12px; }
#roomCode{ display:none; margin-bottom:12px; letter-spacing:5px; text-transform:uppercase; text-align:center; font-size:18px; }
.btn-row{ display:flex; gap:10px; }
.btn{ flex:1; padding:13px 0; border:none; border-radius:11px; font-size:15px; font-weight:600; cursor:pointer;
  transition:filter .15s,transform .06s; }
.btn:active{ transform:scale(.98); }
.btn:disabled{ opacity:.5; cursor:not-allowed; }
.btn.primary{ background:linear-gradient(135deg,#ffd25e,#eda31a); color:#241a04; }
.btn.secondary{ background:rgba(255,255,255,.08); color:var(--text); border:1px solid var(--line); }
.btn:hover:not(:disabled){ filter:brightness(1.08); }
#menuLog{ margin-top:14px; min-height:18px; font-size:13px; color:var(--gold); text-align:center; }
.tip{ margin-top:18px; padding-top:14px; border-top:1px solid rgba(255,255,255,.08); font-size:12px; color:var(--muted); line-height:1.9; }
.tip b{ color:var(--gold); }

/* ===== 游戏内 HUD ===== */
#hud{ position:fixed; top:14px; left:14px; z-index:30; display:none; gap:8px; align-items:center; flex-wrap:wrap; max-width:94vw; }
.hud-box{ background:rgba(6,12,22,.78); border:1px solid var(--line); border-radius:10px; padding:8px 12px; font-size:14px; }
.hud-box b{ color:var(--gold); letter-spacing:2px; margin-left:4px; }
.hud-btn{ background:rgba(255,255,255,.1); border:1px solid var(--line); color:var(--text); border-radius:8px;
  padding:6px 10px; font-size:12px; cursor:pointer; }
.hud-btn:hover{ background:rgba(255,255,255,.2); }
#board{ position:fixed; top:14px; right:150px; z-index:30; width:158px; display:none; background:rgba(6,12,22,.78);
  border:1px solid var(--line); border-radius:12px; padding:9px 11px; font-size:12px; }
#board .ttl{ color:var(--muted); margin-bottom:5px; font-size:11px; letter-spacing:1px; }
#board .row{ display:flex; align-items:center; gap:7px; padding:3px 0; }
#board .row.me{ color:#fff; }
#board .dot{ width:9px; height:9px; border-radius:50%; flex:none; }
#board .nm{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#board .sc{ color:var(--gold); font-weight:600; }
#sysLog{ position:fixed; bottom:26px; left:50%; transform:translateX(-50%); z-index:30; display:none;
  background:rgba(6,12,22,.9); border:1px solid var(--line); border-radius:10px; padding:9px 16px;
  font-size:13px; max-width:86vw; text-align:center; }

/* ===== 表情短语条 ===== */
#emoteBar{ position:fixed; right:14px; bottom:14px; z-index:30; display:none; gap:6px; }
#emoteBar button{ background:rgba(6,12,22,.78); border:1px solid var(--line); color:#fff; border-radius:8px;
  padding:7px 11px; font-size:12px; cursor:pointer; }
#emoteBar button:hover{ background:rgba(255,255,255,.18); }

@media (max-width:560px){
  #board{ width:112px; right:150px; }
  #board .nm{ max-width:46px; }
  .hud-box{ padding:6px 9px; font-size:14px; }
  input{ font-size:16px; }
  #emoteBar{ right:10px; bottom:16px; }
  #emoteBar button{ padding:7px 9px; font-size:12px; }
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<!-- ===== 主菜单 ===== -->
<div id="menu">
  <div class="panel">
    <svg class="mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <circle cx="32" cy="32" r="27" fill="#16352a" stroke="#f0b93a" stroke-width="3"/>
      <path d="M32 10l7 15 16 7-16 7-7 15-7-15-16-7 16-7z" fill="#f0b93a"/>
      <circle cx="32" cy="32" r="5" fill="#fff3c4"/>
    </svg>
    <h1>大地图探险</h1>
    <p class="sub">多人联机 · 在 <b>7000×7000</b> 的广袤大陆上冒险<br/>收集金币与宝石 · 躲避史莱姆 · 与朋友比拼得分</p>
    <input id="nick" maxlength="8" placeholder="你的昵称" />
    <input id="roomCode" maxlength="5" placeholder="5 位房间码" />
    <div class="btn-row">
      <button id="btnCreate" class="btn primary">创建房间</button>
      <button id="btnJoin" class="btn secondary">加入房间</button>
    </div>
    <div id="menuLog"></div>
    <p class="tip">操作：WASD / 方向键移动，手机端左下角虚拟摇杆。<br/>捡<b>金币</b>+1 · 捡<b>宝石</b>+5 · 捡<b>闪电</b>加速 · 被史莱姆碰到丢 3 分。<br/>把 5 位房间码发给朋友即可同场游玩，得分与位置实时同步。</p>
  </div>
</div>

<!-- ===== 游戏内 HUD ===== -->
<div id="hud">
  <div class="hud-box">房间码<b id="roomCodeText">-</b><button class="hud-btn" id="copyBtn">复制</button></div>
  <div class="hud-box" id="playersInfo">在线 1 人</div>
  <button class="hud-btn" id="btnSound">声</button>
  <button class="hud-btn" id="btnLeave">离开</button>
</div>
<div id="board"></div>
<div id="sysLog"></div>
<div id="emoteBar">
  <button data-ph="冲鸭！">冲鸭！</button>
  <button data-ph="加油！">加油！</button>
  <button data-ph="溜了溜了">溜了溜了</button>
  <button data-ph="看我这里">看我这里</button>
</div>

<script>
(function(){
'use strict';
/* ============ 元素 ============ */
const $=id=>document.getElementById(id);
const canvas=$('game'), ctx=canvas.getContext('2d');
const sysLog=$('sysLog');

/* ============ 常量 ============ */
const TILE=50, MAP_W=140, MAP_H=140;
const WORLD_W=MAP_W*TILE, WORLD_H=MAP_H*TILE;
const PLAYER_R=16, SPEED=235;
const COLORS=['#ff6b6b','#4dabf7','#3ddc84','#ffc233','#c77dff','#22d3ee','#f783ac','#b8f34a'];
const CODE_CHARS='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
/* 多路 STUN + 免费 TURN 中转，提升跨网络/国内网络联机成功率 */
const ICE_CONFIG={
  iceServers:[
    {urls:['stun:stun.cloudflare.com:3478','stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302','stun:stun.openrelay.metered.ca:80']},
    {urls:['turn:openrelay.metered.ca:80','turn:openrelay.metered.ca:443','turn:openrelay.metered.ca:443?transport=tcp'],
     username:'openrelayproject',credential:'openrelayproject'}
  ]
};
/* 地形速度系数：草地/森林/沙漠/雪原 */
const BIOME_SPEED={0:1,1:.82,4:.92,5:.88};
const SOLID=new Set([2,3,6]); /* 岩石/水/山脉 不可通行 */

/* ============ 工具 ============ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rng=mulberry32(20260924);
function makeCode(){let s='';for(let i=0;i<5;i++)s+=CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)];return s;}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  return 'rgb('+clamp((n>>16)+amt,0,255)+','+clamp(((n>>8)&255)+amt,0,255)+','+clamp((n&255)+amt,0,255)+')';
}
function roundRect(c,x,y,w,h,r){
  c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}

/* ============ 地图生成（固定种子，所有端一致） ============ */
function noiseGrid(w,h,seed){
  const r=mulberry32(seed), g=[];
  for(let y=0;y<h;y++){const row=[];for(let x=0;x<w;x++)row.push(r());g.push(row);}
  return g;
}
function noiseAt(g,w,h,x,y){
  const x0=Math.floor(x),y0=Math.floor(y),fx=x-x0,fy=y-y0;
  const a=g[y0%h][x0%w],b=g[y0%h][(x0+1)%w],c=g[(y0+1)%h][x0%w],d=g[(y0+1)%h][(x0+1)%w];
  return (a+(b-a)*fx)*(1-fy)+(c+(d-c)*fx)*fy;
}
const NW=26,NH=26;
const nA=noiseGrid(NW,NH,11), nB=noiseGrid(NW,NH,57), nC=noiseGrid(NW,NH,93);
function heightAt(tx,ty){
  const u=tx/MAP_W*NW, v=ty/MAP_H*NH;
  return noiseAt(nA,NW,NH,u,v)*.55+noiseAt(nB,NW,NH,u*2.2,v*2.2)*.30+noiseAt(nC,NW,NH,u*5,v*5)*.15;
}
const grid=[];
for(let y=0;y<MAP_H;y++){grid.push(new Array(MAP_W).fill(0));}
/* 按高度分带：草地→森林→沙漠→水→雪原 */
for(let y=0;y<MAP_H;y++)for(let x=0;x<MAP_W;x++){
  const h=heightAt(x,y);
  grid[y][x]= h<.30?0 : h<.50?1 : h<.64?4 : h<.72?3 : 5;
}
/* 湖泊圆斑 */
for(let i=0;i<9;i++){
  const cx=2+Math.floor(rng()*(MAP_W-4)), cy=2+Math.floor(rng()*(MAP_H-4)), r=3+rng()*5;
  for(let y=Math.max(1,cy-7);y<=Math.min(MAP_H-2,cy+7);y++)
    for(let x=Math.max(1,cx-7);x<=Math.min(MAP_W-2,cx+7);x++)
      if(Math.hypot(x-cx,y-cy)<=r) grid[y][x]=3;
}
/* 岩石丛 */
for(let i=0;i<140;i++){
  const x=1+Math.floor(rng()*(MAP_W-2)), y=1+Math.floor(rng()*(MAP_H-2));
  if(grid[y][x]===0||grid[y][x]===4) grid[y][x]=2;
}
/* 边界山脉 */
for(let x=0;x<MAP_W;x++){grid[0][x]=6;grid[MAP_H-1][x]=6;}
for(let y=0;y<MAP_H;y++){grid[y][0]=6;grid[y][MAP_W-1]=6;}

function isSolid(tx,ty){if(tx<0||ty<0||tx>=MAP_W||ty>=MAP_H)return true;return SOLID.has(grid[ty][tx]);}
function speedAt(tx,ty){if(tx<0||ty<0||tx>=MAP_W||ty>=MAP_H)return 1;const g=grid[ty][tx];return BIOME_SPEED[g]!==undefined?BIOME_SPEED[g]:1;}
function hitsSolid(x,y,r){
  const t0x=Math.floor((x-r)/TILE),t1x=Math.floor((x+r)/TILE),t0y=Math.floor((y-r)/TILE),t1y=Math.floor((y+r)/TILE);
  for(let ty=t0y;ty<=t1y;ty++)for(let tx=t0x;tx<=t1x;tx++){
    if(isSolid(tx,ty)){
      const cx=Math.max(tx*TILE,Math.min(x,tx*TILE+TILE));
      const cy=Math.max(ty*TILE,Math.min(y,ty*TILE+TILE));
      if(Math.hypot(x-cx,y-cy)<=r) return true;
    }
  }
  return false;
}
function movePlayer(p,dx,dy){
  p.x+=dx; if(hitsSolid(p.x,p.y,PLAYER_R)) p.x-=dx;
  p.y+=dy; if(hitsSolid(p.x,p.y,PLAYER_R)) p.y-=dy;
  p.x=Math.max(PLAYER_R,Math.min(WORLD_W-PLAYER_R,p.x));
  p.y=Math.max(PLAYER_R,Math.min(WORLD_H-PLAYER_R,p.y));
}
function spawnPos(){
  for(let i=0;i<800;i++){
    const tx=2+Math.floor(Math.random()*(MAP_W-4)),ty=2+Math.floor(Math.random()*(MAP_H-4));
    const x=tx*TILE+TILE/2,y=ty*TILE+TILE/2;
    if(!isSolid(tx,ty)&&!hitsSolid(x,y,PLAYER_R+12)) return {x,y};
  }
  return {x:WORLD_W/2,y:WORLD_H/2};
}

/* ============ 可拾取物（金币/宝石/加速） ============ */
let items=[];
{
  const NUM={coin:200,gem:26,boost:12};
  let guard=0;
  for(const kind of ['coin','gem','boost']){
    let n=0;
    while(n<NUM[kind]&&guard<80000){
      guard++;
      const tx=1+Math.floor(rng()*(MAP_W-2)), ty=1+Math.floor(rng()*(MAP_H-2));
      if(isSolid(tx,ty))continue;
      const x=tx*TILE+TILE/2, y=ty*TILE+TILE/2;
      if(items.some(c=>Math.hypot(c.x-x,c.y-y)<TILE*1.6))continue;
      items.push({id:items.length,kind,x,y,taken:false,takenAt:0});
      n++;
    }
  }
}

/* ============ 史莱姆（房主权威模拟，客户端只渲染） ============ */
const MONSTER_NUM=9, MONSTER_SPEED=98, MONSTER_R=15, CHASE_R=290;
let monsters=[];
function spawnMonster(){
  for(let i=0;i<900;i++){
    const tx=2+Math.floor(Math.random()*(MAP_W-4)),ty=2+Math.floor(Math.random()*(MAP_H-4));
    if(isSolid(tx,ty))continue;
    return {id:monsters.length,x:tx*TILE+TILE/2,y:ty*TILE+TILE/2,vx:(Math.random()-.5)*40,vy:(Math.random()-.5)*40,ph:Math.random()*6.28,cooldown:0};
  }
  return {id:monsters.length,x:WORLD_W/2,y:WORLD_H/2,vx:0,vy:0,ph:0,cooldown:0};
}

/* ============ 粒子 ============ */
let parts=[];
function burst(x,y,color,n,spd){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.28, s=(Math.random()*.6+.4)*spd;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,decay:.018+Math.random()*.02,color,size:2+Math.random()*3});
  }
}
function stepParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=p.decay;
    if(p.life<=0)parts.splice(i,1);
  }
}
function drawParts(){
  for(const p of parts){
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size*p.life,0,6.28); ctx.fill();
  }
  ctx.globalAlpha=1;
}

/* ============ 音效（Web Audio 合成，首次点击后启用） ============ */
let audio={ctx:null,ready:false,enabled:true};
function initAudio(){
  if(audio.ready)return;
  try{audio.ctx=new (window.AudioContext||window.webkitAudioContext)();audio.ready=true;}catch(e){}
}
function beep(freq,dur,type,vol,slideTo){
  if(!audio.ready||!audio.enabled||!audio.ctx)return;
  const t0=audio.ctx.currentTime;
  const o=audio.ctx.createOscillator(), g=audio.ctx.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(freq,t0);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo),t0+dur);
  g.gain.setValueAtTime(vol||.1,t0); g.gain.exponentialRampToValueAtTime(.001,t0+dur);
  o.connect(g); g.connect(audio.ctx.destination); o.start(t0); o.stop(t0+dur+.03);
}
const sfx={
  coin(){beep(760,.09,'square',.09,1150);},
  gem(){beep(660,.12,'triangle',.11);setTimeout(()=>beep(880,.12,'triangle',.11),80);setTimeout(()=>beep(1320,.18,'triangle',.11),160);},
  boost(){beep(300,.28,'sawtooth',.09,1500);},
  hit(){beep(150,.24,'sawtooth',.15,70);},
  join(){beep(520,.1,'sine',.09);setTimeout(()=>beep(780,.12,'sine',.09),95);},
  pop(){beep(520,.06,'sine',.08,720);}
};
addEventListener('pointerdown',initAudio,{once:true});
addEventListener('keydown',initAudio,{once:true});

/* ============ 游戏状态 ============ */
let peer=null, hostConn=null, isHost=false, roomCode='', myPeerId='';
let me=null, players={};
let inGame=false, joined=false, shake=0;
let myName='', myColor=COLORS[Math.floor(Math.random()*COLORS.length)];
function makeMe(){const s=spawnPos();return {id:'',name:myName,color:myColor,x:s.x,y:s.y,score:0,invulnUntil:0,boostUntil:0,fx:0,fy:0,phase:Math.random()*6.28};}

/* ============ 网络（PeerJS，房主权威） ============ */
function serializePlayers(){return Object.values(players).map(p=>({id:p.id,name:p.name,color:p.color,x:Math.round(p.x),y:Math.round(p.y),score:p.score,invulnUntil:p.invulnUntil,boostUntil:p.boostUntil,fx:Math.round(p.fx*100)/100,fy:Math.round(p.fy*100)/100}));}
function broadcast(msg){for(const k in peer.connections){peer.connections[k].forEach(c=>{if(c.open)try{c.send(msg);}catch(e){}});}}
function broadcastItems(){broadcast({type:'items',items:items.map(i=>({id:i.id,kind:i.kind,x:i.x,y:i.y,taken:i.taken}))});}

function handleHostMsg(id,msg){
  if(!msg||typeof msg!=='object')return;
  if(msg.type==='hello'){
    const p=players[id]={id,name:String(msg.name||'玩家').slice(0,8),
      color:COLORS.includes(msg.color)?msg.color:COLORS[Math.floor(Math.random()*COLORS.length)],
      x:0,y:0,score:0,invulnUntil:0,boostUntil:0,fx:0,fy:0,phase:Math.random()*6.28};
    const s=spawnPos(); p.x=s.x; p.y=s.y;
    broadcast({type:'sys',text:p.name+' 加入了游戏'});
    const joinMsg={type:'join',players:serializePlayers(),
      items:items.map(i=>({id:i.id,kind:i.kind,x:i.x,y:i.y,taken:i.taken})),
      monsters:monsters.map(m=>({id:m.id,x:m.x,y:m.y,ph:m.ph}))};
    peer.connections[id].forEach(c=>{if(c.open)c.send(joinMsg);});
  }else if(msg.type==='pos'&&players[id]){
    players[id].x=msg.x; players[id].y=msg.y;
  }else if(msg.type==='collect'&&players[id]){
    const it=items.find(i=>i.id===msg.itemId&&!i.taken);
    if(it){
      it.taken=true; it.takenAt=Date.now();
      const p=players[id];
      if(it.kind==='coin')p.score+=1;
      else if(it.kind==='gem')p.score+=5;
      else p.boostUntil=Date.now()+4000;
      broadcastItems();
    }
  }else if(msg.type==='emote'&&players[id]){
    broadcast({type:'emote',id,phrase:String(msg.phrase||'').slice(0,8)});
  }
}
function onClientLeft(id){
  if(!players[id])return;
  const name=players[id].name;
  delete players[id];
  broadcast({type:'left',id});
  broadcast({type:'sys',text:name+' 离开了游戏'});
}

function handleHostData(msg){
  if(!msg||typeof msg!=='object')return;
  if(msg.type==='state'){
    const seen={};
    for(const p of msg.players){
      if(p.id===myPeerId){me.score=p.score;me.boostUntil=p.boostUntil;me.invulnUntil=p.invulnUntil;continue;}
      if(!players[p.id]){
        players[p.id]={id:p.id,name:p.name,color:p.color,x:p.x,y:p.y,score:p.score,invulnUntil:p.invulnUntil,boostUntil:p.boostUntil,fx:p.fx||0,fy:p.fy||0,phase:Math.random()*6.28};
        if(joined){uiLog(p.name+' 加入了游戏'); sfx.join();}
      }else{
        const q=players[p.id]; q.x=p.x; q.y=p.y; q.score=p.score; q.invulnUntil=p.invulnUntil; q.boostUntil=p.boostUntil; q.fx=p.fx||0; q.fy=p.fy||0;
      }
      seen[p.id]=1;
    }
    for(const k in players){ if(!seen[k]&&k!==myPeerId){ delete players[k]; } }
  }else if(msg.type==='join'){
    players={};
    for(const p of msg.players){ if(p.id===myPeerId)continue; players[p.id]={id:p.id,name:p.name,color:p.color,x:p.x,y:p.y,score:p.score,invulnUntil:p.invulnUntil,boostUntil:p.boostUntil,fx:p.fx||0,fy:p.fy||0,phase:Math.random()*6.28}; }
    items=msg.items.map(i=>({id:i.id,kind:i.kind,x:i.x,y:i.y,taken:i.taken,takenAt:0}));
    monsters=msg.monsters.map(m=>({id:m.id,x:m.x,y:m.y,ph:m.ph,cooldown:0}));
    showGame(); joined=true;
    uiLog('已进入房间 '+roomCode);
  }else if(msg.type==='items'){
    items=msg.items.map(i=>({id:i.id,kind:i.kind,x:i.x,y:i.y,taken:i.taken,takenAt:0}));
  }else if(msg.type==='monsters'){
    const cur={}; for(const m of monsters)cur[m.id]=m;
    const next=[];
    for(const m of msg.monsters){
      const old=cur[m.id];
      if(old){old.x=m.x;old.y=m.y;old.ph=m.ph;next.push(old);}
      else next.push({id:m.id,x:m.x,y:m.y,ph:m.ph,cooldown:0});
    }
    monsters=next;
  }else if(msg.type==='left'){
    if(players[msg.id]){const n=players[msg.id].name; delete players[msg.id]; uiLog(n+' 离开了游戏');}
  }else if(msg.type==='hit'){
    if(msg.id===myPeerId){shake=10; sfx.hit(); if(me)burst(me.x,me.y,'#ff6b6b',16,120);}
  }else if(msg.type==='emote'){
    const ph=String(msg.phrase||'').slice(0,8);
    if(msg.id===myPeerId){if(me){me.emote=ph;me.emoteUntil=Date.now()+2200;} }
    else if(players[msg.id]){players[msg.id].emote=ph;players[msg.id].emoteUntil=Date.now()+2200;}
  }else if(msg.type==='sys'){
    uiLog(msg.text);
  }
}

function cleanupPeer(){
  if(hostConn){try{hostConn.close();}catch(e){} hostConn=null;}
  if(peer){try{peer.destroy();}catch(e){} peer=null;}
  isHost=false; inGame=false; joined=false; roomCode=''; myPeerId=''; players={}; me=null;
}
function resetToMenu(){
  cleanupPeer();
  joining=false;
  $('menu').style.display='flex'; $('hud').style.display='none'; $('board').style.display='none'; $('emoteBar').style.display='none';
}
function showGame(){
  $('menu').style.display='none'; $('hud').style.display='flex'; $('board').style.display='block'; $('emoteBar').style.display='flex';
  $('roomCodeText').textContent=roomCode; inGame=true;
}

function createRoom(){
  cleanupPeer();
  isHost=true;
  myName=$('nick').value.trim()||('玩家'+Math.floor(10+Math.random()*90));
  me=makeMe();
  monsters=[]; for(let i=0;i<MONSTER_NUM;i++)monsters.push(spawnMonster());
  showLoading('正在创建房间…');
  let opened=false;
  const openTimer=setTimeout(()=>{
    if(!opened){
      hideLoading();
      if(peer){try{peer.destroy();}catch(e){}}
      peer=null;
      uiLog('连接超时：请检查网络后刷新重试');
      resetToMenu();
    }
  },20000);
  const tryCreate=()=>{
    const code=makeCode();
    peer=new Peer(code,{config:ICE_CONFIG});
    peer.on('open',id=>{
      opened=true; clearTimeout(openTimer);
      myPeerId=id; roomCode=id; me.id=id; me.invulnUntil=0; me.boostUntil=0;
      players={}; players[id]=me;
      hideLoading(); showGame();
      uiLog('房间创建成功，把房间码发给朋友吧');
      sfx.join();
    });
    peer.on('connection',c=>{
      c.on('open',()=>{
        c.on('data',d=>handleHostMsg(c.peer,d));
        c.on('close',()=>onClientLeft(c.peer));
        c.on('error',()=>onClientLeft(c.peer));
      });
    });
    peer.on('error',e=>{
      if(e.type==='unavailable-id'){try{peer.destroy();}catch(_){} tryCreate();}
      else if(inGame&&(e.type==='network'||e.type==='socket-error'||e.type==='server-error'||e.type==='disconnected')){
        uiLog('网络波动，正在重连…');
        if(peer&&!peer.destroyed){try{peer.reconnect();}catch(_){}}
      }
      else{hideLoading(); clearTimeout(openTimer); uiLog('创建失败：'+e.type+'，请检查网络'); resetToMenu();}
    });
    peer.on('disconnected',()=>{
      if(peer&&!peer.destroyed){try{peer.reconnect();}catch(e){}}
    });
  };
  tryCreate();
}

let joining=false;
function joinRoom(code){
  if(joining)return;
  joining=true;
  cleanupPeer();
  isHost=false;
  myName=$('nick').value.trim()||('玩家'+Math.floor(10+Math.random()*90));
  me=makeMe();
  showLoading('正在连接房间 '+code+' …');
  let opened=false;
  const timer=setTimeout(()=>{
    if(!opened){
      hideLoading();
      if(peer){try{peer.destroy();}catch(e){}}
      peer=null; hostConn=null;
      uiLog('连接超时：请检查网络后刷新重试');
      resetToMenu();
    }
  },20000);
  peer=new Peer({config:ICE_CONFIG});
  peer.on('open',id=>{
    myPeerId=id;
    hostConn=peer.connect(code,{reliable:false});
    hostConn.on('open',()=>{
      opened=true; clearTimeout(timer);
      hideLoading(); roomCode=code; hostConn.send({type:'hello',name:myName,color:myColor});
    });
    hostConn.on('data',d=>handleHostData(d));
    hostConn.on('close',()=>{uiLog('与房主断开连接'); resetToMenu();});
    hostConn.on('error',()=>{uiLog('连接出错'); resetToMenu();});
  });
  peer.on('error',e=>{
    if(inGame&&(e.type==='network'||e.type==='socket-error'||e.type==='server-error'||e.type==='disconnected')){
      uiLog('网络波动，正在重连…');
      if(peer&&!peer.destroyed){try{peer.reconnect();}catch(_){}}
      return;
    }
    hideLoading(); clearTimeout(timer);
    if(e.type==='peer-unavailable')uiLog('房间 '+code+' 不存在或已关闭');
    else uiLog('连接失败：'+e.type+'，请检查网络');
    resetToMenu();
  });
  peer.on('disconnected',()=>{
    if(peer&&!peer.destroyed){try{peer.reconnect();}catch(e){}}
  });
}

const keys={};
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  keys[e.code]=true;
});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});

let joy={active:false,ox:0,oy:0,dx:0,dy:0};
canvas.addEventListener('touchstart',e=>{
  if(e.touches.length===1){const t=e.touches[0]; joy.active=true; joy.ox=t.clientX; joy.oy=t.clientY; joy.dx=0; joy.dy=0;}
},{passive:true});
canvas.addEventListener('touchmove',e=>{
  if(!joy.active)return;
  e.preventDefault();
  const t=e.touches[0];
  let dx=t.clientX-joy.ox, dy=t.clientY-joy.oy;
  const len=Math.hypot(dx,dy), R=54;
  if(len>R){dx=dx/len*R; dy=dy/len*R;}
  joy.dx=dx/R; joy.dy=dy/R;
},{passive:false});
canvas.addEventListener('touchend',()=>{joy.active=false; joy.dx=0; joy.dy=0;});
canvas.addEventListener('touchcancel',()=>{joy.active=false; joy.dx=0; joy.dy=0;});

function inputVec(){
  let dx=0,dy=0;
  if(keys['ArrowLeft']||keys['KeyA'])dx-=1;
  if(keys['ArrowRight']||keys['KeyD'])dx+=1;
  if(keys['ArrowUp']||keys['KeyW'])dy-=1;
  if(keys['ArrowDown']||keys['KeyS'])dy+=1;
  if(joy.active&&(joy.dx||joy.dy)){dx+=joy.dx; dy+=joy.dy;}
  const len=Math.hypot(dx,dy);
  if(len>1){dx/=len; dy/=len;}
  return {dx,dy,len};
}

/* ============ 史莱姆模拟（仅房主） ============ */
function stepMonsters(dt){
  if(!isHost)return;
  const now=Date.now();
  for(const m of monsters){
    m.ph+=dt;
    m.cooldown=Math.max(0,m.cooldown-dt*1000);
    let target=null, bd=CHASE_R;
    for(const p of Object.values(players)){
      const d=Math.hypot(p.x-m.x,p.y-m.y);
      if(d<bd){bd=d; target=p;}
    }
    let tx,ty;
    if(target){
      const d=Math.hypot(target.x-m.x,target.y-m.y)||1;
      tx=((target.x-m.x)/d)*MONSTER_SPEED; ty=((target.y-m.y)/d)*MONSTER_SPEED;
    }else{
      if(Math.random()<dt*.9){const a=Math.random()*6.28; m.vx=Math.cos(a)*MONSTER_SPEED*.45; m.vy=Math.sin(a)*MONSTER_SPEED*.45;}
      tx=m.vx; ty=m.vy;
    }
    /* 简易移动：撞墙反向 */
    m.x+=tx*dt; if(hitsSolid(m.x,m.y,MONSTER_R-2)){m.x-=tx*dt; m.vx=-m.vx;}
    m.y+=ty*dt; if(hitsSolid(m.x,m.y,MONSTER_R-2)){m.y-=ty*dt; m.vy=-m.vy;}
    m.x=clamp(m.x,MONSTER_R,WORLD_W-MONSTER_R); m.y=clamp(m.y,MONSTER_R,WORLD_H-MONSTER_R);
    /* 撞玩家 */
    if(m.cooldown<=0){
      for(const p of Object.values(players)){
        if(now-p.invulnUntil<0)continue;
        if(Math.hypot(p.x-m.x,p.y-m.y)<PLAYER_R+MONSTER_R+4){
          p.score=Math.max(0,p.score-3); p.invulnUntil=now+2000;
          m.cooldown=1200; m.x-=tx*8; m.y-=ty*8;
          broadcast({type:'hit',id:p.id});
          broadcast({type:'sys',text:p.name+' 被史莱姆偷袭，丢了 3 分'});
          if(p===me){shake=10; sfx.hit(); burst(p.x,p.y,'#ff6b6b',16,120);}
          break;
        }
      }
    }
  }
}

/* ============ 拾取 ============ */
function tryCollect(p){
  const now=Date.now();
  for(const it of items){
    if(!it.taken&&Math.hypot(p.x-it.x,p.y-it.y)<PLAYER_R+13){
      it.taken=true; it.takenAt=now;
      if(it.kind==='coin')p.score+=1;
      else if(it.kind==='gem')p.score+=5;
      else p.boostUntil=now+4000;
      burst(it.x,it.y,it.kind==='gem'?'#59d0ff':(it.kind==='boost'?'#ffd25e':'#f0b93a'),it.kind==='coin'?10:16,90);
      if(it.kind==='coin')sfx.coin();
      else if(it.kind==='gem')sfx.gem();
      else sfx.boost();
      return it.id;
    }
  }
  return null;
}

function drawTile(tx,ty){
  const g=grid[ty][tx], px=tx*TILE, py=ty*TILE;
  const hash=(tx*73856093^ty*19349663);
  switch(g){
    case 0:{ /* 草地 */
      const v=hash%3;
      ctx.fillStyle=v===0?'#47a054':(v===1?'#42984d':'#4ca85b'); ctx.fillRect(px,py,TILE,TILE);
      const f=hash%7;
      if(f===0){ctx.fillStyle='rgba(255,255,255,.05)';ctx.fillRect(px+9,py+11,5,3);ctx.fillRect(px+32,py+30,5,3);}
      else if(f===1){
        const cx=px+10+(hash%30), cy=py+10+(hash%30);
        ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx,cy,3,0,6.28);ctx.fill();
        ctx.fillStyle='#ffd25e';ctx.beginPath();ctx.arc(cx,cy,1.6,0,6.28);ctx.fill();
      }
      break; }
    case 1:{ /* 森林 */
      ctx.fillStyle='#2f7a3d'; ctx.fillRect(px,py,TILE,TILE);
      const cx=px+TILE/2, cy=py+TILE*.55;
      ctx.fillStyle='rgba(0,0,0,.18)'; ctx.beginPath(); ctx.arc(cx+3,cy+6,TILE*.32,0,6.28); ctx.fill();
      ctx.fillStyle='#1e5c2c'; ctx.beginPath(); ctx.arc(cx,cy,TILE*.32,0,6.28); ctx.fill();
      ctx.fillStyle='#2c7a3d'; ctx.beginPath(); ctx.arc(cx-3,cy-3,TILE*.22,0,6.28); ctx.fill();
      ctx.fillStyle='#5b3a1e'; ctx.fillRect(px+TILE/2-4,py+TILE*.72,8,10);
      break; }
    case 2:{ /* 岩石 */
      ctx.fillStyle='#7d8078'; ctx.fillRect(px,py,TILE,TILE);
      ctx.fillStyle='rgba(0,0,0,.25)'; ctx.beginPath(); ctx.arc(px+TILE/2+2,py+TILE/2+2,TILE*.3,0,6.28); ctx.fill();
      ctx.fillStyle='#8f928a'; ctx.beginPath(); ctx.arc(px+TILE/2,py+TILE/2,TILE*.3,0,6.28); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.14)'; ctx.beginPath(); ctx.arc(px+TILE*.42,py+TILE*.4,5,0,6.28); ctx.fill();
      break; }
    case 3:{ /* 水 */
      ctx.fillStyle='#2f6cb0'; ctx.fillRect(px,py,TILE,TILE);
      const w=hash%4;
      ctx.strokeStyle='rgba(255,255,255,.10)'; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(px+8,py+16+w); ctx.quadraticCurveTo(px+TILE/2,py+10+w,px+TILE-8,py+16+w); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(px+6,py+36-w); ctx.quadraticCurveTo(px+TILE/2,py+42-w,px+TILE-6,py+36-w); ctx.stroke();
      break; }
    case 4:{ /* 沙漠 */
      const v=hash%3;
      ctx.fillStyle=v===0?'#d9b45b':(v===1?'#d4ae52':'#dfba64'); ctx.fillRect(px,py,TILE,TILE);
      if(hash%5===0){ctx.strokeStyle='rgba(120,90,30,.25)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(px+6,py+30);ctx.quadraticCurveTo(px+TILE/2,py+24,px+TILE-6,py+30);ctx.stroke();}
      break; }
    case 5:{ /* 雪原 */
      ctx.fillStyle='#dde8f2'; ctx.fillRect(px,py,TILE,TILE);
      if(hash%6===0){ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(px+14,py+22,2.5,0,6.28);ctx.fill();ctx.arc(px+34,py+34,2,0,6.28);ctx.fill();}
      break; }
    default:{ /* 山脉 */
      ctx.fillStyle='#5b6368'; ctx.fillRect(px,py,TILE,TILE);
      ctx.fillStyle='#6d767c'; ctx.beginPath(); ctx.moveTo(px,py+TILE); ctx.lineTo(px+TILE/2,py+6); ctx.lineTo(px+TILE,py+TILE); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#eef4f8'; ctx.beginPath(); ctx.moveTo(px+TILE/2,py+6); ctx.lineTo(px+TILE*.64,py+22); ctx.lineTo(px+TILE*.36,py+22); ctx.closePath(); ctx.fill();
      break; }
  }
}

  if(now-p.boostUntil<0){
    ctx.strokeStyle='#ffd25e'; ctx.globalAlpha=.5+Math.sin(ts/80)*.25; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(x,y,PLAYER_R+6,0,6.28); ctx.stroke(); ctx.globalAlpha=1;
  }
  if(p.emoteUntil&&p.emoteUntil>now){
    const tw=Math.min(120,p.emote.length*15+20), th=26, bx=x-tw/2, by=y-56;
    ctx.fillStyle='rgba(10,18,30,.88)'; ctx.strokeStyle='rgba(255,255,255,.3)'; ctx.lineWidth=1.4;
    roundRect(ctx,bx,by,tw,th,9); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-5,by+th); ctx.lineTo(x+5,by+th); ctx.lineTo(x,by+th+6); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='12px "PingFang SC","Microsoft YaHei",sans-serif'; ctx.textAlign='center';
    ctx.fillText(p.emote,x,by+17);
  }
}

function drawScene(ts){
  ctx.clearRect(0,0,W,H);
  if(!me)return;
  const tgtX=Math.max(0,Math.min(me.x-W/2,WORLD_W-W)), tgtY=Math.max(0,Math.min(me.y-H/2,WORLD_H-H));
  const k=Math.min(1,.08);
  camX+=(tgtX-camX)*k; camY+=(tgtY-camY)*k;
  ctx.save();
  if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake); shake*=.88; if(shake<.4)shake=0;}
  ctx.translate(-camX,-camY);

  const t0x=Math.floor(camX/TILE)-1, t1x=Math.ceil((camX+W)/TILE)+1;
  const t0y=Math.floor(camY/TILE)-1, t1y=Math.ceil((camY+H)/TILE)+1;
  for(let ty=Math.max(0,t0y);ty<=Math.min(MAP_H-1,t1y);ty++)
    for(let tx=Math.max(0,t0x);tx<=Math.min(MAP_W-1,t1x);tx++)
      drawTile(tx,ty);

  for(const it of items){
    if(it.taken)continue;
    if(it.x<camX-40||it.x>camX+W+40||it.y<camY-40||it.y>camY+H+40)continue;
    drawItem(it,ts);
  }
  for(const m of monsters){
    if(m.x<camX-80||m.x>camX+W+80||m.y<camY-80||m.y>camY+H+80)continue;
    drawMonster(m,ts);
  }
  for(const p of Object.values(players)){
    if(p.x<camX-120||p.x>camX+W+120||p.y<camY-120||p.y>camY+H+120)continue;
    drawPlayer(p,p.id===myPeerId,ts);
  }
  if(!isHost&&me)drawPlayer(me,true,ts);
  drawParts();
  ctx.restore();

  drawMinimap();
  if(joy.active)drawJoystick();
}

function drawMinimap(){
  const size=132, pad=14, x=W-size-pad, y=pad;
  ctx.fillStyle='rgba(6,12,22,.68)';
  ctx.fillRect(x-5,y-5,size+10,size+10);
  const k=size/WORLD_W;
  const cols=['#2e6b3a','#1d4d27','#757575','#2a6cb8','#c2a054','#aebfd0','#6d767c'];
  for(let ty=0;ty<MAP_H;ty+=2)for(let tx=0;tx<MAP_W;tx+=2){
    ctx.fillStyle=cols[grid[ty][tx]]||'#2e6b3a';
    ctx.fillRect(x+tx*TILE*k,y+ty*TILE*k,2.2,2.2);
  }
  const dot=p=>{
    const px=p.rx!==undefined?p.rx:p.x, py=p.ry!==undefined?p.ry:p.y;
    ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(x+px*k,y+py*k,3,0,6.28); ctx.fill();
    if(p.id===myPeerId){ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();}
  };
  for(const p of Object.values(players))dot(p);
  if(!isHost&&me)dot(me);
  ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=1;
  ctx.strokeRect(x+camX*k,y+camY*k,Math.max(8,W*k),Math.max(8,H*k));
}

function drawJoystick(){
  const bx=86, by=H-96, R=54;
  ctx.globalAlpha=.6;
  ctx.beginPath(); ctx.arc(bx,by,R,0,6.28); ctx.fillStyle='rgba(255,255,255,.14)'; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.45)'; ctx.lineWidth=2; ctx.stroke();
  ctx.beginPath(); ctx.arc(bx+joy.dx*R*.7,by+joy.dy*R*.7,24,0,6.28); ctx.fillStyle='rgba(255,255,255,.35)'; ctx.fill();
  ctx.globalAlpha=1;
}

/* ============ 主循环 ============ */
let lastT=0, lastSend=0, lastBoard=0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,((ts-lastT)/1000)||.016);
  lastT=ts;
  if(me&&inGame){
    const v=inputVec();
    const boosted=Date.now()-me.boostUntil<0;
    const spd=SPEED*(boosted?1.6:1)*speedAt(Math.floor(me.x/TILE),Math.floor(me.y/TILE));
    if(v.len>0){
      me.fx=v.dx/v.len; me.fy=v.dy/v.len;
      movePlayer(me,me.fx*spd*dt,me.fy*spd*dt);
    }
    const got=tryCollect(me);
    if(got!==null){
      if(isHost)broadcastItems();
      else if(hostConn&&hostConn.open)hostConn.send({type:'collect',itemId:got});
    }
    if(!isHost&&hostConn&&hostConn.open&&ts-lastSend>80){
      lastSend=ts;
      hostConn.send({type:'pos',x:Math.round(me.x),y:Math.round(me.y)});
    }
  }
  stepMonsters(dt);
  stepParts(dt);
  drawScene(ts);
  if(ts-lastBoard>400&&inGame){
    lastBoard=ts;
    const list=isHost?Object.values(players):Object.values(players).concat(me?[me]:[]);
    list.sort((a,b)=>b.score-a.score);
    $('playersInfo').textContent='在线 '+list.length+' 人';
    $('board').innerHTML='<div class="ttl">得分榜</div>'+list.map(p=>
      '<div class="row'+(p.id===myPeerId?' me':'')+'"><span class="dot" style="background:'+p.color+'"></span>'+
      '<span class="nm">'+escapeHtml(p.name)+'</span><span class="sc">'+p.score+'</span></div>').join('');
  }
}

/* 房主状态/怪物广播（10Hz） */
setInterval(()=>{
  if(isHost&&peer&&peer.open&&me){
    if(Object.keys(peer.connections).length>0) broadcast({type:'state',players:serializePlayers()});
    if(monsters.length) broadcast({type:'monsters',monsters:monsters.map(m=>({id:m.id,x:Math.round(m.x),y:Math.round(m.y),ph:m.ph}))});
  }
},100);

/* 道具 25 秒后重生（房主） */
setInterval(()=>{
  if(!isHost)return;
  const now=Date.now(); let changed=false;
  for(const it of items){ if(it.taken&&now-it.takenAt>25000){it.taken=false; changed=true;} }
  if(changed) broadcastItems();
},2000);

/* ============ UI ============ */
let logT=0;
function uiLog(txt){
  sysLog.innerHTML='<span>'+escapeHtml(txt)+'</span>';
  sysLog.style.display='block';
  clearTimeout(logT);
  logT=setTimeout(()=>{sysLog.style.display='none';},3500);
}
function showLoading(t){$('menuLog').textContent=t; $('btnCreate').disabled=true; $('btnJoin').disabled=true;}
function hideLoading(){$('menuLog').textContent=''; $('btnCreate').disabled=false; $('btnJoin').disabled=false;}

$('nick').value='玩家'+Math.floor(10+Math.random()*90);
$('btnCreate').addEventListener('click',createRoom);
$('btnJoin').addEventListener('click',()=>{
  const input=$('roomCode');
  input.style.display='block';
  const code=input.value.trim().toUpperCase();
  if(/^[A-Z0-9]{5}$/.test(code)){joinRoom(code); return;}
  input.focus();
});
$('roomCode').addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    const code=e.target.value.trim().toUpperCase();
    if(/^[A-Z0-9]{5}$/.test(code))joinRoom(code);
    else uiLog('请输入 5 位房间码');
  }
});
$('copyBtn').addEventListener('click',()=>{
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(roomCode).then(()=>uiLog('房间码已复制'),()=>uiLog('复制失败，请手动复制'));
  }else uiLog('复制失败，请手动复制');
});
$('btnSound').addEventListener('click',function(){
  audio.enabled=!audio.enabled;
  this.textContent=audio.enabled?'声':'静';
  uiLog(audio.enabled?'音效已开启':'音效已关闭');
});
$('btnLeave').addEventListener('click',()=>{resetToMenu(); uiLog('已离开房间');});
document.querySelectorAll('#emoteBar button').forEach(b=>{
  b.addEventListener('click',()=>{
    const ph=b.getAttribute('data-ph');
    if(isHost){
      broadcast({type:'emote',id:myPeerId,phrase:ph});
      if(me){me.emote=ph; me.emoteUntil=Date.now()+2200;}
    }else if(hostConn&&hostConn.open){
      hostConn.send({type:'emote',phrase:ph});
      if(me){me.emote=ph; me.emoteUntil=Date.now()+2200;}
    }
    sfx.pop();
  });
});

if(typeof Peer==='undefined'){
  const s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js';
  document.head.appendChild(s);
  uiLog('正在加载联机组件，请稍候…');
}

requestAnimationFrame(loop);
/* __JS_PART2__ */
})();
